name: RSS to SNS
on:
  schedule:
    # 15分ごとに実行
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  rss-to-sns:
    runs-on: macos-latest
    # 15分以上かかったらタイムアウト
    timeout-minutes: 15
    steps:
      # リポジトリのチェックアウト
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1.7.3
        with:
          chrome-version: latest
      # Denoのセットアップ
      - name: Setup Deno
        uses: denoland/setup-deno@909cc5acb0fdd60627fb858598759246509fa755 # v2.0.2
        with:
          deno-version: v2.x
      # Cacheの復元
      - name: Cache Deno Deps
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.deno
            ~/.cache/deno
          key: ${{ hashFiles('deno.lock') }}
      - name: Restore Last Execution Time Cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .timestamp
          key: last-execution-time
          restore-keys: last-execution-time-
      - name: Restore itemlist Cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            .itemList.json
          key: item-list
          restore-keys: item-list-
      - name: Check timestamp file exists
        id: check_timestamp
        uses: andstor/file-existence-action@076e0072799f4942c8bc574a82233e1e4d13e9d6 # v3.0.0
        with:
          files: .timestamp
      - name: Check itemlist file exists
        id: check_itemlist
        uses: andstor/file-existence-action@076e0072799f4942c8bc574a82233e1e4d13e9d6 # v3.0.0
        with:
          files: .itemList.json
      # 環境変数を設定
      - name: Set Current Time
        if: steps.check_timestamp.outputs.files_exists == 'false'
        run: |
          echo "$(deno eval 'console.log(new Date().getTime())')" > .timestamp
      - name: Set Current itemlist
        if: steps.check_itemlist.outputs.files_exists == 'false'
        run: |
          echo "[]" > .itemList.json
      # Denoの実行
      - name: Deno Run
        run: |
          deno install
          deno run -A main.ts
        env:
          BLUESKY_IDENTIFIER: ${{secrets.BLUESKY_IDENTIFIER}}
          BLUESKY_PASSWORD: ${{secrets.BLUESKY_PASSWORD}}
          RSS_URL: ${{secrets.RSS_URL}}
          WEBHOOK_URL: ${{secrets.WEBHOOK_URL}}
          GOOGLE_AI_API_KEY: ${{secrets.GOOGLE_AI_API_KEY}}
          GEMINI_MODEL: ${{secrets.GEMINI_MODEL}}
      # Cacheの保存
      - name: Save Last Execution Time Cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: ${{always()}}
        with:
          path: |
            .timestamp
          key: last-execution-time-${{github.run_id}}
      - name: Save itemlist Cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: ${{always()}}
        with:
          path: |
            .itemList.json
          key: item-list-${{github.run_id}}
